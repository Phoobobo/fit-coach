            <li><strong><!-- EXERCISE_TOTAL --></strong><span>个示范</span></li>

          </ul>
        </div>
        <!-- FEATURED_PANEL -->
      </section>

        <div class="section-head">
          <div>
            <h2>动作库</h2>
            <p class="section-sub">点进卡片，看循环示范和动作要点。</p>

          <p class="section-count"><!-- EXERCISE_COUNT --></p>
        </div>
        <div class="card-grid">
          <!-- EXERCISE_CARDS -->
        </div>
